<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#210019">
  <title>Happy Diwali | Festival of Lights</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="festival" id="festival">
    <div class="scene" aria-hidden="true">
      <img class="artwork" src="diwali-reference.jpg" alt="">
      <div class="vignette"></div>
      <div class="mandala-glow"></div>
      <div class="floating-lights" id="floatingLights"></div>
      <div class="sparkle-layer" id="sparkles"></div>
      <div class="fireworks" id="fireworks"></div>
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
    </div>

    <div class="top-label" aria-hidden="true">
      <span class="top-ornament">✦</span>
      <span>THE FESTIVAL OF LIGHTS</span>
      <span class="top-ornament">✦</span>
    </div>

    <section class="content" aria-label="Diwali celebration">
      <div class="intro">
        <p class="eyebrow">A NIGHT OF LIGHT, JOY & TOGETHERNESS</p>
        <h1>Happy <span>Diwali</span></h1>
        <p class="subtitle">Festival of Light</p>
      </div>
      <div class="welcome-note">May your world shine bright</div>
      <button class="celebrate-btn" id="celebrateBtn" type="button">
        <span class="button-spark">✧</span>
        <span>Let's celebrate Diwali</span>
        <span class="button-spark">✧</span>
      </button>
      <p class="hint" id="hint">Tap to light up the night</p>
    </section>
    <div class="sound-note" aria-hidden="true">✦ &nbsp; SHUBH DEEPAVALI &nbsp; ✦</div>
  </main>
  <script src="script.js"></script>
</body>

</html>
